<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HIROTO — Predictive Signal Terminal</title>
  <meta name="description" content="Institutional predictive signal intelligence terminal.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="logo.jpg">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-shell">
    
    <!-- 1. AMOLED Header -->
    <header class="top-header">
      <div class="brand-area">
        <div class="brand-logo-wrap">
          <img src="logo.jpg" alt="HIROTO AI" class="brand-logo-img">
        </div>
        <div class="brand-info">
          <h1>HIROTO</h1>
          <span class="brand-sub">AI TERMINAL</span>
        </div>
      </div>

      <div class="header-controls">
        <!-- Token Balance Badge -->
        <div class="token-badge" id="headerTokenBadge" title="Available Tokens">
          <span class="token-icon">⚡</span>
          <span id="userTokenCount">--</span>
        </div>

        <!-- PWA Install Button (Shown on PWA supported browsers) -->
        <button class="btn-pwa" id="btnInstallPwa" style="display:none;" title="Install PWA App">
          <span>📲 Install</span>
        </button>

        <div class="status-pill" id="statusPill">
          <span class="pulse-dot"></span>
          <span id="statusText">LIVE</span>
        </div>

        <button class="btn-icon" id="btnSound" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>
        <button class="btn-icon" id="btnSync" title="Sync Latest" aria-label="Sync">↻</button>
        <button class="btn-icon danger" id="btnLogout" title="Logout" aria-label="Logout">⎋</button>
      </div>
    </header>

    <!-- 2. Performance Summary (Win Rate & Total Rounds Removed as requested) -->
    <section class="metrics-row">
      <div class="metric-box">
        <span class="metric-label">Tokens Left</span>
        <span class="metric-value gold" id="metricTokens">--</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">Win Streak</span>
        <span class="metric-value emerald" id="metricStreak">0 🔥</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">AI Consensus</span>
        <span class="metric-value cyan" id="metricConsensus">--</span>
      </div>
    </section>

    <!-- 3. PREDICTION HERO CARD -->
    <main class="prediction-hero" id="predictionHero">
      <!-- Target Period & Countdown Header -->
      <div class="hero-top">
        <div class="period-badge-wrap">
          <span class="period-title">TARGET</span>
          <span class="period-num" id="targetPeriodNum">#----</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-label">DRAW IN</span>
          <span class="countdown-timer" id="countdownTimer">00:60</span>
        </div>
      </div>

      <!-- Main Prediction Banner -->
      <div class="hero-main-banner">
        <div class="signal-banner BIG" id="signalBanner">
          <span class="signal-tag">RECOMMENDED SIGNAL</span>
          <span class="signal-text" id="signalText">BIG</span>
          <span class="signal-range" id="signalRange">5 · 6 · 7 · 8 · 9</span>
        </div>

        <!-- Quick Details & Action -->
        <div class="signal-action-wrap">
          <!-- Confidence Bar -->
          <div class="confidence-wrap">
            <div class="confidence-header">
              <span>Model Confidence</span>
              <strong id="confidencePct">--%</strong>
            </div>
            <div class="confidence-track">
              <div class="confidence-fill" id="confidenceBar" style="width: 50%;"></div>
            </div>
          </div>

          <!-- Target Lucky Digits & Copy Button Row -->
          <div class="action-bar-row">
            <div class="lucky-digits-box">
              <span class="lucky-label">LUCKY DIGITS</span>
              <div class="digits-group">
                <span class="digit-chip primary" id="luckyDigit1">-</span>
                <span class="digit-chip secondary" id="luckyDigit2">-</span>
              </div>
            </div>

            <button class="btn-copy-signal" id="btnCopySignal">
              <span>📋 Copy Signal</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 4. DRAW HISTORY (Zero-scroll, strictly synchronized) -->
    <section class="history-card">
      <div class="history-header">
        <h2 class="history-title">Draw History</h2>
        <div class="filter-pills">
          <button class="filter-pill active" data-filter="ALL">All</button>
          <button class="filter-pill" data-filter="WINS">Wins</button>
          <button class="filter-pill" data-filter="LOSSES">Losses</button>
        </div>
      </div>

      <!-- No-Scroll Responsive History Table -->
      <div class="history-table-container">
        <table class="history-table">
          <thead>
            <tr>
              <th class="col-period">Period</th>
              <th class="col-signal">Signal</th>
              <th class="col-result">Result</th>
              <th class="col-outcome">Outcome</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr>
              <td colspan="4" class="empty-cell">
                Synchronizing live feed...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toastMsg">✓ Notification</div>

  <!-- Core Script -->
  <script type="module" src="app.js"></script>
</body>
</html>
