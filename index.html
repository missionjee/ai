<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HIROTO AI — Access Gateway</title>
  <meta name="description" content="Secure license key gateway for institutional signal intelligence platform.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #060913;
      --bg-card: rgba(13, 19, 36, 0.78);
      --border-subtle: rgba(255, 255, 255, 0.09);
      --neon-cyan: #00f2fe;
      --neon-pink: #ff2a6d;
      --neon-emerald: #00f5a0;
      --neon-gold: #ffb703;
      --neon-purple: #9d4edd;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-main: 'Rajdhani', -apple-system, sans-serif;
      --font-mono: 'Space Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Aurora Mesh Background */
    .aurora-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 65% 55% at 15% 20%, rgba(0, 242, 254, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 80%, rgba(255, 42, 109, 0.1) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 50% 50%, rgba(121, 40, 202, 0.08) 0%, transparent 70%);
      animation: auroraFloat 16s ease-in-out infinite alternate;
    }

    @keyframes auroraFloat {
      0% { filter: hue-rotate(0deg); opacity: 0.85; transform: scale(1); }
      100% { filter: hue-rotate(25deg); opacity: 1; transform: scale(1.04); }
    }

    /* Interactive Background Canvas */
    #bgCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Login Gateway Container */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      animation: enterCard 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes enterCard {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
    }

    /* Brand Section */
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-glyph {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .login-brand h1 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ffffff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .login-brand p {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .key-counter {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--neon-cyan);
    }

    .input-wrap {
      position: relative;
    }

    .key-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2.5px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: all 0.25s ease;
    }

    .key-input::placeholder {
      letter-spacing: 1px;
      font-size: 14px;
      color: var(--text-muted);
      text-transform: none;
    }

    .key-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
      background: rgba(0, 0, 0, 0.55);
    }

    .key-input.error {
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px rgba(255, 42, 109, 0.3);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue), var(--neon-purple));
      background-size: 200% auto;
      color: #040814;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 25px rgba(0, 242, 254, 0.35);
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 242, 254, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Guest Access Option */
    .guest-row {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .btn-guest {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .btn-guest:hover {
      color: var(--neon-cyan);
      text-decoration: underline;
    }

    /* Feedback Banner */
    .status-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    .status-banner.error {
      display: block;
      background: rgba(255, 42, 109, 0.15);
      color: var(--neon-pink);
      border: 1px solid rgba(255, 42, 109, 0.35);
    }

    .status-banner.success {
      display: block;
      background: rgba(0, 245, 160, 0.15);
      color: var(--neon-emerald);
      border: 1px solid rgba(0, 245, 160, 0.35);
    }

    .status-banner.info {
      display: block;
      background: rgba(0, 242, 254, 0.15);
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 242, 254, 0.35);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Active Session Info */
    .session-card {
      display: none;
      background: rgba(0, 245, 160, 0.08);
      border: 1px solid rgba(0, 245, 160, 0.25);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .session-card.show {
      display: block;
    }

    .session-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--neon-emerald);
      margin-bottom: 4px;
    }

    .session-days {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .btn-resume {
      margin-top: 10px;
      background: var(--neon-emerald);
      color: #040814;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-family: var(--font-main);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-resume:hover {
      box-shadow: 0 0 15px var(--neon-emerald);
    }

    /* Footer Meta */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
      }
      .key-input {
        font-size: 16px;
        letter-spacing: 2px;
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>

  <div class="aurora-bg"></div>
  <canvas id="bgCanvas"></canvas>

  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand -->
      <div class="login-brand">
        <div class="brand-glyph">⚝</div>
        <h1>HIROTO AI</h1>
        <p>Institutional Signal Intelligence Gateway</p>
      </div>

      <!-- Active Session Notice (if already logged in) -->
      <div class="session-card" id="sessionCard">
        <div class="session-title">● Active Clearance Found</div>
        <div class="session-days" id="sessionDays">-- DAYS REMAINING</div>
        <button class="btn-resume" id="btnResume">Launch Terminal →</button>
      </div>

      <!-- Feedback Status -->
      <div class="status-banner" id="statusBanner"></div>

      <!-- Input Form -->
      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <div class="form-label">
            <span>License Key</span>
            <span class="key-counter" id="keyCounter">0 / 12</span>
          </div>
          <div class="input-wrap">
            <input 
              type="text" 
              class="key-input" 
              id="keyInput" 
              placeholder="XXXX-XXXX-XXXX" 
              autocomplete="off" 
              autocapitalize="characters" 
              spellcheck="false"
              maxlength="14"
            >
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <span id="btnText">VERIFY ACCESS KEY</span>
        </button>
      </form>

      <!-- Guest Access / Demo Mode -->
      <div class="guest-row">
        <button class="btn-guest" id="btnGuest">Explore in Simulator Mode →</button>
      </div>

      <div class="login-footer">
        HIROTO AI PLATFORM • ENCRYPTED ENDPOINT
      </div>

    </div>
  </div>

  <!-- Background Particle Animation -->
  <script>
    (function() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      function initParticles() {
        particles = [];
        const count = Math.min(45, Math.floor((w * h) / 22000));
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            r: Math.random() * 1.5 + 0.5
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(0, 242, 254, ${(1 - d / 120) * 0.12})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }

        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 242, 254, 0.4)';
          ctx.fill();
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
        });

        requestAnimationFrame(draw);
      }

      resize();
      initParticles();
      draw();
      window.addEventListener('resize', () => { resize(); initParticles(); });
    })();
  </script>

  <!-- Firebase Validation & Auth Handling -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBouQx_5CL0aZdK_HrHx3fuHvHQwhj4LQ",
      authDomain: "enigma-app-25066.firebaseapp.com",
      projectId: "enigma-app-25066"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Firebase initialization warning:", e);
    }

    const keyInput = document.getElementById('keyInput');
    const keyCounter = document.getElementById('keyCounter');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const statusBanner = document.getElementById('statusBanner');
    const sessionCard = document.getElementById('sessionCard');
    const sessionDays = document.getElementById('sessionDays');
    const btnResume = document.getElementById('btnResume');
    const btnGuest = document.getElementById('btnGuest');

    function showStatus(msg, type = 'info') {
      statusBanner.textContent = msg;
      statusBanner.className = `status-banner ${type}`;
    }

    // Check for existing active session
    function checkActiveSession() {
      const raw = localStorage.getItem('hiroto_signals_session');
      if (!raw) return;
      try {
        const session = JSON.parse(raw);
        const exp = session.expires || session.expiresAt;
        if (!exp) {
          // Lifetime
          sessionDays.textContent = 'LIFETIME CLEARANCE';
          sessionCard.classList.add('show');
          return;
        }
        const diff = new Date(exp) - new Date();
        const days = Math.ceil(diff / 86400000);
        if (days > 0) {
          sessionDays.textContent = `${days} DAYS CLEARANCE`;
          sessionCard.classList.add('show');
        } else {
          localStorage.removeItem('hiroto_signals_session');
        }
      } catch (e) {
        localStorage.removeItem('hiroto_signals_session');
      }
    }

    // Auto-Format XXXX-XXXX-XXXX
    keyInput.addEventListener('input', (e) => {
      let raw = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 12);
      let formatted = '';
      for (let i = 0; i < raw.length; i++) {
        if (i > 0 && i % 4 === 0) formatted += '-';
        formatted += raw[i];
      }
      e.target.value = formatted;
      keyCounter.textContent = `${raw.length} / 12`;
      keyInput.classList.remove('error');
      statusBanner.className = 'status-banner';
    });

    // Hiroto Cryptographic Signature Verification
    const CHARSET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const SALT = 'HIROTO_AI_V5_MASTER_2026';
    const EPOCH = new Date('2026-01-01T00:00:00Z');

    function simpleHash(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c64e6d;
      for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return 4294967296 * (2097151 & h2) + (h1 >>> 0);
    }

    function computeChecksum(prefix) {
      const val = simpleHash(prefix + SALT);
      let n = Math.abs(val);
      let cs = '';
      for (let i = 0; i < 4; i++) {
        cs += CHARSET[n % CHARSET.length];
        n = Math.floor(n / CHARSET.length);
      }
      return cs;
    }

    function verifyCryptographicKey(keyStr) {
      if (!keyStr || typeof keyStr !== 'string') return { valid: false };
      const clean = keyStr.trim().toUpperCase();
      const parts = clean.split('-');
      if (parts.length !== 3 || parts[0].length !== 4 || parts[1].length !== 4 || parts[2].length !== 4) {
        return { valid: false };
      }

      const prefix = parts[0] + '-' + parts[1];
      if (parts[2] !== computeChecksum(prefix)) {
        return { valid: false };
      }

      const seg2 = parts[1];
      if (seg2 === 'LZZZ') {
        return { valid: true, lifetime: true, expires: null };
      }

      if (seg2[0] !== 'D') return { valid: false };

      const i1 = CHARSET.indexOf(seg2[1]);
      const i2 = CHARSET.indexOf(seg2[2]);
      const i3 = CHARSET.indexOf(seg2[3]);
      if (i1 < 0 || i2 < 0 || i3 < 0) return { valid: false };

      const dayDiff = (i1 << 10) | (i2 << 5) | i3;
      const expDate = new Date(EPOCH.getTime() + dayDiff * 86400000 + 86399000);
      const now = new Date();

      if (expDate < now) {
        return { valid: false, expired: true, expires: expDate.toISOString() };
      }

      return { valid: true, lifetime: false, expires: expDate.toISOString() };
    }

    // Verification Logic
    async function verifyKey() {
      const val = keyInput.value.trim().toUpperCase();
      if (val.length < 14) {
        keyInput.classList.add('error');
        showStatus('Please enter a complete 12-character license key', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnText.textContent = 'VERIFYING CLEARANCE...';
      showStatus('Authenticating access credential...', 'info');

      try {
        let keyRecord = null;

        // 1. Check remote Firestore
        if (db) {
          try {
            const snap = await getDocs(collection(db, 'keys'));
            const list = snap.docs.map(d => d.data());
            keyRecord = list.find(k => k.key === val);
          } catch (e) {
            console.warn('Firestore fetch failed:', e);
          }
        }

        // 2. Check local backup keys
        if (!keyRecord) {
          const localBackup = JSON.parse(localStorage.getItem('hiroto_local_keys') || '[]');
          keyRecord = localBackup.find(k => k.key === val);
        }

        // 3. Verify Cryptographic Signature (for keys generated by Keygen without Firestore auth)
        if (!keyRecord) {
          const cryptoCheck = verifyCryptographicKey(val);
          if (cryptoCheck.valid) {
            keyRecord = {
              key: val,
              expires: cryptoCheck.expires,
              expiresAt: cryptoCheck.expires,
              status: 'active',
              validity: cryptoCheck.lifetime ? 0 : 'Verified',
              created: new Date().toISOString()
            };
          } else if (cryptoCheck.expired) {
            keyInput.classList.add('error');
            const expDateStr = new Date(cryptoCheck.expires).toLocaleDateString();
            showStatus(`This access key expired on ${expDateStr}.`, 'error');
            btnSubmit.disabled = false;
            btnText.textContent = 'VERIFY ACCESS KEY';
            return;
          }
        }

        if (!keyRecord) {
          keyInput.classList.add('error');
          showStatus('Invalid access key. Key not found.', 'error');
          btnSubmit.disabled = false;
          btnText.textContent = 'VERIFY ACCESS KEY';
          return;
        }

        // Check revocation
        if (keyRecord.status === 'revoked') {
          keyInput.classList.add('error');
          showStatus('This access key has been revoked.', 'error');
          btnSubmit.disabled = false;
          btnText.textContent = 'VERIFY ACCESS KEY';
          return;
        }

        // Check expiration
        const exp = keyRecord.expires || keyRecord.expiresAt;
        if (exp && new Date(exp) < new Date()) {
          keyInput.classList.add('error');
          showStatus('This access key has expired.', 'error');
          btnSubmit.disabled = false;
          btnText.textContent = 'VERIFY ACCESS KEY';
          return;
        }

        // Success!
        localStorage.setItem('hiroto_signals_session', JSON.stringify(keyRecord));
        showStatus('✓ Clearance Granted! Redirecting to Terminal...', 'success');
        
        setTimeout(() => {
          window.location.href = 'd.html';
        }, 1200);

      } catch (err) {
        console.error(err);
        showStatus('Handshake failed. Check connection.', 'error');
        btnSubmit.disabled = false;
        btnText.textContent = 'VERIFY ACCESS KEY';
      }
    }

    btnSubmit.addEventListener('click', verifyKey);
    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyKey();
    });

    if (btnResume) {
      btnResume.addEventListener('click', () => {
        window.location.href = 'd.html';
      });
    }

    if (btnGuest) {
      btnGuest.addEventListener('click', () => {
        // Set guest session
        localStorage.setItem('hiroto_signals_session', JSON.stringify({
          key: 'SIMULATOR-MODE',
          status: 'active',
          guest: true,
          created: new Date().toISOString()
        }));
        window.location.href = 'd.html';
      });
    }

    checkActiveSession();
  </script>
</body>
</html>
