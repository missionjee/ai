<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HIROTO AI — Access Gateway</title>
  <meta name="description" content="Secure institutional signal intelligence platform.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-amoled: #000000;
      --bg-card: rgba(8, 9, 12, 0.94);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --gold-accent: #f5b335;
      --gold-glow: rgba(245, 179, 53, 0.25);
      --emerald-win: #00e676;
      --crimson-big: #ff3366;
      --ice-small: #00e5ff;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-main: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Space Grotesk', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #000000;
      color: var(--text-primary);
      font-family: var(--font-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Universal Mobile & Desktop Fixed Background Layer */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(10, 14, 24, 0.45) 0%, rgba(0, 0, 0, 0.82) 100%),
        url('bg.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 0;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      -webkit-transform: translate3d(0, 0, 0);
    }

    /* Login Gateway Container */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: linear-gradient(180deg, #0e1219 0%, #06080c 100%);
      border: 1px solid #263143;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-bottom: 3px solid #000000;
      border-radius: 20px;
      padding: 34px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    /* Brand Section */
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo-wrap {
      width: 62px;
      height: 62px;
      margin: 0 auto 14px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--gold-accent);
      background: #000;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.7);
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-brand h1 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .login-brand p {
      font-size: 11px;
      color: var(--gold-accent);
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    /* Device Security Badge */
    .device-guard-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0 auto 20px;
      background: linear-gradient(180deg, #062319 0%, #02110c 100%);
      border: 1px solid #065f46;
      border-top: 1px solid #059669;
      border-bottom: 2px solid #000000;
      border-radius: 8px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--emerald-win);
      width: fit-content;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .key-counter {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--gold-accent);
    }

    .key-input {
      width: 100%;
      background: #030507;
      border: 1px solid #1e293b;
      border-top: 1px solid #0a0d14;
      border-bottom: 2px solid #334155;
      border-radius: 12px;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.9);
      transition: all 0.2s ease;
    }

    .key-input::placeholder {
      letter-spacing: 1px;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: none;
    }

    .key-input:focus {
      border-color: var(--gold-accent);
      border-bottom-color: var(--gold-accent);
      background: #06090d;
    }

    .key-input.error {
      border-color: var(--crimson-big);
      border-bottom-color: var(--crimson-big);
    }

    /* 3D Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      color: #000000;
      border: none;
      border-top: 1px solid #fef3c7;
      border-bottom: 2px solid #78350f;
      padding: 14px;
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
      transition: all 0.15s ease;
      margin-top: 6px;
    }

    .btn-submit:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(1px);
      border-bottom-width: 1px;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Status Message */
    .status-msg {
      margin-top: 14px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      font-weight: 700;
      display: none;
    }

    .status-msg.error {
      color: var(--crimson-big);
      display: block;
    }

    .status-msg.success {
      color: var(--emerald-win);
      display: block;
    }

    .status-msg.info {
      color: var(--gold-accent);
      display: block;
    }

    /* Feature Badges with 3D Bevel */
    .features-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #1e293b;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid #1e2533;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .feature-icon {
      color: var(--gold-accent);
    }

    /* Quick Resume Button */
    .resume-box {
      margin-top: 14px;
      display: none;
      text-align: center;
    }

    .btn-resume {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-top: 1px solid #475569;
      border-bottom: 2px solid #000;
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .btn-resume:hover {
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
    }

    .btn-pwa-install {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #38bdf8;
      border-top: 1px solid #7dd3fc;
      border-bottom: 2px solid #0369a1;
      color: #38bdf8;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
      transition: all 0.2s;
    }

    .btn-pwa-install:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo-wrap">
          <img src="logo.jpg" alt="HIROTO AI" class="brand-logo-img">
        </div>
        <h1>HIROTO AI</h1>
        <p>INSTITUTIONAL SIGNAL GATEWAY</p>
      </div>

      <div class="device-guard-badge">
        <span>🔒</span> Single-Device Security Active
      </div>

      <div class="form-group">
        <div class="form-label">
          <span>License Access Key</span>
          <span class="key-counter" id="keyCounter">0 / 14</span>
        </div>
        <div class="input-wrap">
          <input 
            type="text" 
            id="keyInput" 
            class="key-input" 
            placeholder="XXXX-XXXX-XXXX" 
            maxlength="14" 
            autocomplete="off"
            spellcheck="false"
          >
        </div>
      </div>

      <button id="btnSubmit" class="btn-submit">
        <span id="btnText">AUTHENTICATE KEY</span>
      </button>

      <div class="status-msg" id="statusMsg"></div>

      <div class="resume-box" id="resumeBox">
        <button class="btn-resume" id="btnResume">
          Resume Session (<span id="resumeKey"></span>) →
        </button>
      </div>

      <div class="features-list">
        <div class="feature-item">
          <span class="feature-icon">⚡</span> 1 Token = 1 Round
        </div>
        <div class="feature-item">
          <span class="feature-icon">🔒</span> Anti-Multi Device
        </div>
        <div class="feature-item">
          <span class="feature-icon">🎯</span> Real-time Sync
        </div>
        <div class="feature-item">
          <span class="feature-icon">📱</span> PWA Standalone
        </div>
      </div>

      <button class="btn-pwa-install" id="btnInstallPwaIndex" style="display:none; width: 100%; margin-top: 16px;">
        <span>📲 Install Hiroto AI App (PWA)</span>
      </button>
    </div>
  </div>

  <script type="module">
    import { supabaseClient } from "./supabaseClient.js";

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // PWA Install Prompt
    let deferredPrompt = null;
    const btnInstallPwa = document.getElementById('btnInstallPwaIndex');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (btnInstallPwa) btnInstallPwa.style.display = 'inline-flex';
    });

    if (btnInstallPwa) {
      btnInstallPwa.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          btnInstallPwa.style.display = 'none';
        }
        deferredPrompt = null;
      });
    }

    const keyInput = document.getElementById('keyInput');
    const keyCounter = document.getElementById('keyCounter');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const statusMsg = document.getElementById('statusMsg');
    const resumeBox = document.getElementById('resumeBox');
    const btnResume = document.getElementById('btnResume');
    const resumeKey = document.getElementById('resumeKey');

    // Auto-Format XXXX-XXXX-XXXX
    keyInput.addEventListener('input', (e) => {
      let raw = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      let parts = [];
      for (let i = 0; i < raw.length && i < 12; i += 4) {
        parts.push(raw.substring(i, i + 4));
      }
      e.target.value = parts.join('-');
      keyCounter.textContent = `${e.target.value.length} / 14`;
      keyInput.classList.remove('error');
      statusMsg.style.display = 'none';
    });

    function showStatus(text, type = 'info') {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg ${type}`;
    }

    // Check query params for multi-device logout
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('reason') === 'multi_device') {
      showStatus('Logged out: Account accessed from another device.', 'error');
    }

    // Check Active Session
    function checkActiveSession() {
      const session = supabaseClient.getSession();
      if (session && session.key) {
        resumeKey.textContent = session.key;
        resumeBox.style.display = 'block';
      }
    }

    // Key Authentication via Supabase
    async function verifyKey() {
      const val = keyInput.value.trim().toUpperCase();
      const KEY_PATTERN = /^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/;

      if (!KEY_PATTERN.test(val)) {
        keyInput.classList.add('error');
        showStatus('Please enter a valid 12-digit key (XXXX-XXXX-XXXX)', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnText.textContent = 'AUTHENTICATING...';
      showStatus('Binding device and verifying tokens in Supabase...', 'info');

      try {
        const result = await supabaseClient.loginWithKey(val);

        if (result.success) {
          showStatus('✓ Access Granted! Entering Terminal...', 'success');
          setTimeout(() => {
            window.location.replace('/d.html');
          }, 600);
        } else {
          keyInput.classList.add('error');
          showStatus(result.message || 'Authentication failed. Please check your key.', 'error');
          btnSubmit.disabled = false;
          btnText.textContent = 'AUTHENTICATE KEY';
        }
      } catch (err) {
        console.error(err);
        showStatus('Network error connecting to database.', 'error');
        btnSubmit.disabled = false;
        btnText.textContent = 'AUTHENTICATE KEY';
      }
    }

    btnSubmit.addEventListener('click', verifyKey);
    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyKey();
    });

    if (btnResume) {
      btnResume.addEventListener('click', () => {
        window.location.replace('/d.html');
      });
    }

    checkActiveSession();
  </script>
</body>
</html>
